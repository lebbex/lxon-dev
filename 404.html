<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Redirecting...</title>
	<script>
		if (location.hostname.endsWith('.dev')) {
			const host = location.hostname.replace(/\.dev$/, '.com');
			location.replace(location.protocol + '//' + host + location.pathname + location.search + location.hash);
		}
	</script>
</head>
<body>
	<noscript>
		<a href="https://lxon.lebbex.com">Continue to lxon.lebbex.com</a>
	</noscript>
</body>
</html>
